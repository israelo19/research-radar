name: radar

on:
  schedule:
    - cron: "23 11 * * *"   # every day at 11:23 UTC = 6:23 AM Eastern (7:23 AM during daylight time)
  push:
    # Run right away when the code or settings change, so a fix can be checked
    # without waiting for tomorrow. Saved runs don't trigger this.
    branches: [main]
    paths: ["radar/**", "config.toml", ".github/workflows/radar.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal run, check = only test your API keys"
        type: choice
        options: [run, check]
        default: run

permissions:
  contents: write   # to save runs, digests and the viewer back to the repo
  issues: write     # to open the daily digest as an issue (phone notification)

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check keys
        if: ${{ github.event.inputs.mode == 'check' }}
        env:
          BITDEER_API_KEY: ${{ secrets.BITDEER_API_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          # If the key was saved under another name, the script finds any secret or
          # variable with BITDEER (or FEATHERLESS) in its name. It logs the name, never the value.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: python -m radar check

      - name: Run radar (watch each step live here)
        if: ${{ github.event.inputs.mode != 'check' }}
        env:
          BITDEER_API_KEY: ${{ secrets.BITDEER_API_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          # If the key was saved under another name, the script finds any secret or
          # variable with BITDEER (or FEATHERLESS) in its name. It logs the name, never the value.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -m radar run

      - name: Save runs to the repo
        if: ${{ always() && github.event.inputs.mode != 'check' }}
        run: |
          git config user.name "Israel Ogwu"
          git config user.email "izzymax192@gmail.com"
          git add runs digests state site
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "radar: run $(date -u +%Y-%m-%dT%H%MZ)"
          git pull --rebase --autostash
          git push

      - name: Upload trace viewer
        if: ${{ always() && github.event.inputs.mode != 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: trace-viewer
          path: site/index.html
          if-no-files-found: ignore
