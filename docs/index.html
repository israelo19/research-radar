  padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.span:hover { background: var(--chip); }
.span.sel { background: var(--sel); }
.span .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.span .nm b { font-weight: 600; }
.span .nm .lbl { color: var(--muted); }

.kind.llm { color: var(--accent); border-color: var(--accent); }

.bar.llm { background: var(--bar-llm); } .bar.error { background: var(--err); }
.dur { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.err { color: var(--err); }
.detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.detail h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 3px 12px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }

saster-response questions often involve multi-source workflows that combine spatial databases, map-derived features, satellite imagery, raster products, and reusable geospatial artifacts, where correctness depends on preserving spatial scope, temporal context, and intermediate execution state. While large language models and coding agents offer a promising interface for such workflows, they struggle with geospatial-specific failure modes, including handling large artifacts, selecting the wrong evidence source, losing spatial or temporal metadata, and applying invalid geometric operations. We introduce GeoFaham, a domain-specialized multi-agent system for geospatial disaster analytics. GeoFaham decomposes workflows into specialist agents for vector operations, map feature retrieval, imagery discovery, and raster analysis, coordinated by an Orchestrator with a dual-ledger control loop for dependency-aware planning, progress tracking, validation, and replanning. To support artifact-centric collaboration, GeoFaham uses a Response Store that persists full geospatial outputs and typed metadata outside the LLM context window while agents exchange compact identifiers and summaries. We also introduce GeoFaham-Bench, a 40-task benchmark grounded in 17 real-world disaster records, designed to evaluate multi-step geospatial reasoning, cross-source integration, raster-vector computation, artifact generation, and recovery under non-rigid ground truth. We evaluate GeoFaham on GeoFaham-Bench against strong general-purpose coding-agent baselines, including Codex, Claude Code, and OpenCode. GeoFaham achieves the best overall performance, scoring 0.940 versus the next-best 0.879, while using 7.5 times fewer tokens. Our code and benchmark are publicly available at https://github.com/microsoft/GeoFaham.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"scor ess, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in the agent supply chain.\n- \"ai-worms\" (AI worms): Self-propagating attacks across LLM agents and AI applications: AI worms, prompt infections between agents, self-replicating prompts, and how such attacks are detected or stopped.\n- \"agent-escalation\" (Agent privilege escalation): Coding agents and computer-use agents gaining more access than intended: permission prompts, sandbox escapes, exploit benchmarks run by agents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.CR)\nTitle: Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning\nAuthors: Yao Wang, Zehua Ma, Weiming Zhang, Han Fang\nAbstract: Indirect Prompt Injection (IPI) poses a critical threat to LLM agents. Existing defenses largely focus on whether an injection induces a new tool invocation or unintended action. In this paper, we study a different attack surface, parameter poisoning, where the attacker preserves the intended action but manipulates one or more tool arguments, such as a recipient or other task-critical value. Such attacks are difficult to detect because no new action is introduced, while parameter changes themselves are often legitimate parts of the user's request. Our key insight is that the legitimacy of a parameter change should be determined by the trust of the information flow that produces it under the user query. The query induces a task-specific trust hierarchy over available information fields: some are trusted to determine particular parameters, while others should have little or no influence. Based on this insight, we propose AuthorityFlow, a three-stage parameter-level defense. First, it interprets the user query to construct a task-specific trust hierarchy over the information fields available to the agent. Second, for each tool argument, it traces the information flow that produces its current value and attributes the value to its supporting field. Finally, it accepts the value only when that field is trusted to determine the parameter under the current task, allowing high-trust changes while flagging low-trust influence as potential parameter poisoning. We further introduce FactAuthBench for evaluating parameter poisoning in LLM agents. Without defense, the attack success rate reaches 93.06%. AuthorityFlow reduces it to 9.03%, while retaining 82.64% benign task utility compared with 90.28% without defense. Our results show that effective IPI defense requires reasoning not only about what action an agent takes, but also about which information is trusted to determine its parameters.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 6143}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": true,\n  \"thread\": \"mcp-security\",\n  \"score\": 8,\n  \"summary\": \"The paper studies parameter poisoning, an indirect prompt injection attack where an LLM agent performs the intended tool call b hing isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.CR)\nTitle: The Devil is in the Context: Nine Dimensions of Prompt Injection Attacks\nAuthors: Jiamin Chang, Kristina Nikolić, Rishi Sharma, Giovanni Cherubin, Vasilios Mavroudis, Jose Sanchez Vicarte, Arnav Garg, Hammond Pearce\nAbstract: Prompt injection is usually discussed and evaluated as a single, homogeneous type of attack. However, vulnerabilities reported in real-world systems show that prompt injections vary widely. Moreover, the same instruction can be a prompt injection in one context and a legitimate request in another, depending on the user's intent and the system's policies. Ignoring this variation leaves gaps in how defenses are evaluated, and can give a false sense of security against real-world attacks. We identify nine dimensions along which prompt injection attacks differ. Together, they form a taxonomy that describes the injected instruction itself, its relation to the user's task, and how it manifests in the target system. Each dimension affects which defenses can detect or prevent an attack. We first use the taxonomy to characterize six real-world prompt injection vulnerabilities, showing how much these attacks differ. We then apply it to nine prompt injection benchmarks and find that most cover only a small region of this space. Combining benchmarks helps, but 13% of pairwise category combinations remain untested, mostly among the less commonly represented categories. Finally, we show that the taxonomy supports automated annotation of benchmarks and targeted generation of new test cases to fill these gaps. The taxonomy is also useful beyond benchmarks. Defense authors can use it to state which types of prompt injection they evaluated against, and system operators can use it to identify which attacks apply to their system and choose defenses to match.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true o ublication and composition under decentralized authorship stop at the agent harness. We present FreeForm Harness (FFH), a mobile-native agent harness for open, composable extensions. A frozen base and a permanence-aware required layer handle mobile constraints, including location, proactive triggering, and scarce channels. A uniform plugin contract makes independently authored extensions composable, checkable, and replaceable over a frozen socket set. FFH also supports end-user authorship through a tiered commissioned-authoring path. When no existing extension matches a user's intent, a Web coding agent generates a candidate artifact, which is validated and admitted on device under the same contract as other extensions. An Android prototype spans device, market, and cloud. Evaluation shows that architectural boundaries are enforced at runtime; realistic daily-life requests fit the declared composition space without widening it; and user intent reaches on-device execution through retrieval or commissioned authoring, with final trust decisions remaining device-local. FFH advances the agentic Web from \"everything is a plugin\" toward \"everyone is a developer\" on mobile.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 9439}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": true,\n  \"thread\": \"mcp-security\",\n  \"score\": 6,\n  \"summary\": \"It proposes a mobile-native ties, we introduce ScienceVision, a cross-domain benchmark for scientific 3D understanding and reasoning through expert-level visual question answering (VQA). We construct 250 questions, with 50 each from Biology, Chemistry, Medical Imaging, Mechanical CAD, and Architecture, through a pipeline combining synthetic question generation with domain-expert review and annotation. Each task pairs a native 3D artifact with a scientific question, a specified response format, and a task-specific reference answer, requiring domain knowledge to be applied to geometric or topological evidence. We evaluate 12 models on the same questions in three settings: visual question answering with native 3D artifacts accessed through an agent harness's file and code-execution tools; the same workflow augmented with expert-inspired viewer inspection and measurement tools exposed through the Model Context Protocol (MCP); and visual question answering from prescribed rendered 2D images using an agent harness. All settings use the same task-specific deterministic final-answer scoring. The inspection environment supports view changes, target isolation, and slice inspection. In this main comparison, the best mean answer score is 0.53 out of 1. Mean scores in the native-artifact workflow without additional MCP tools exceed those in the rendered-image workflow for every model, by 17.2 percentage points on average.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "sta l, Santiago Akle Serano, Ron Banner, Boris Ginsburg\nAbstract: We introduce Dory1.0-4B, a 4-billion-parameter looped (latent-recurrent) language model with elastic depth: a single checkpoint serves different inference compute budgets. Dory1.0-4B is built on a normalized Transformer (nGPT) backbone with interleaved sliding-window and full-attention layers, organized into an input block, a shared recurrent block, and an output block. At inference, the recurrent block can be applied a variable number of times. We pre-trained Dory1.0-4B on 6 trillion tokens. The first 4.5 trillion tokens were trained in NVFP4, and additional pre-training then extended the context length to 256K tokens. Next, we post-trained the model using Supervised Fine-Tuning (SFT) and Reinforcement Learning with Verifiable Rewards (RLVR), with a difficulty-aware loop curriculum that routes harder prompts to deeper loops. Increasing the loop count improves accuracy, with the largest gains on coding, agentic, and long-context benchmarks. With two or more loops, Dory1.0-4B outperforms larger models such as Qwen3.5-9B, Gemma 4 12B, and Gemma 4 26B-A4B on average across 12 benchmarks. Looping also makes Dory1.0-4B more token-efficient on agentic benchmarks: with four loops, it generates 1.3-2.5x fewer tokens than with one loop, as the extra computation is spent in latent space rather than on longer outputs. To reduce memory during looping, Dory1.0-4B caches keys and values only from the last loop, keeping its KV-cache footprint equal to that of a non-looped model at any loop count while retaining most of the accuracy gains. We open-source the BF16, MXFP8, NVFP4, and GGUF quantized checkpoints.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n s in LLM Coding Agents Verifiably\nAuthors: Wei-Lin Chen, Zhepei Wei, Xinyu Zhu, Yu-Min Tseng, Tzu-Han Lin, Yu Meng\nAbstract: Large language model (LLM) coding agents increasingly operate with shell access, allowing them to write scripts, move files, alter permissions, and modify system configurations. However, an agent may achieve a user's goal while causing unintended harm, such as deleting unrelated files, weakening access controls, or corrupting data, in response to benign inputs without explicit jailbreaking. This failure mode is particularly important because apparent task success may reassure users that an agent behaved correctly, causing harmful side effects to go unnoticed. We call this harmful success: the agent successfully completes the intended benign task while simultaneously causing unintended harm. Despite its importance, harmful success is difficult to measure because conventional task-success metrics overlook harmful behaviors, while existing safety evaluations are often designed solely to assess harmful outcomes. We introduce VeriHarm, an automatic framework for constructing programmatically verifiable benchmarks that directly measure harmful success. VeriHarm minimally perturbs coding tasks to elicit unintended harmful behavior while maintaining the benignity of the task and preserving the original task objective. It then synthesizes executable harm tests that, together with the original task-correctness tests, evaluate both task accuracy and harmful outcomes. Frontier agents, including GPT-5.6-Sol and Claude-Opus-5, achieve an average task accuracy of 95% on our curated VeriHarm-Bench, yet still struggle to complete tasks safely: their safe success rate, the fraction of tasks completed successfully without triggering the designated harm, averages only 37%. These results suggest that successful task completion can frequently coexist with unintended harm, and that task-success metrics alone may substantially understate the potential safety risks poisoning with real tool execution. A 25-class root-cause taxonomy unifies prior classifications, and the open-source tool mcpvenom drives a 9,720-cell susceptibility matrix across 12 frameworks, 18 models, and 45 attack scenarios, with a dual oracle that confirms exfiltration via canary HTTP receipt. The overall attack success rate is 22.9% (2,113 vulnerable cells). Of these, 64.9% dispatch an attacker tool call, 23.0% contact the attacker endpoint, and 12.1% verifiably exfiltrate a secret. Resistance is model-level: nine core frameworks cluster within 23 to 26% (chi-squared = 3.30, p = 0.91), and no framework implements intentional defense. Incidental framework properties mitigate in specific cases, and a regex description scanner rejects 20 of 45 scenarios at a 7.2% false-positive rate, so metadata scanning alone is a partial control. Model ASR ranges from 0.4% to 49.7%. Claude Opus 4.8 is vulnerable in 8 of 530 cells while issuing 223 explicit refusals. A code-level audit finds no intentional defense across twelve frameworks, and all five coordinated disclosures across four vendors were rejected.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 4007}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": true,\n  \"thread\": \"mcp-security\",\n  \"score\": 10,\n  \"summary\": \"A cross-framework measurement study of MCP tool poisoning with real tool execution. It builds a 25 s on LegalBench-RAG and ranks first on the public leaderboards of the Enterprise RAG Challenge and ViDoRe V3. Grid Studio scores highest on the 519 power-system tasks and is the fastest of all the systems we compare, both by a statistically significant margin. With an optimiser in the loop, its reinforcement packages cost 33-67% less on average than those the agent designs alone.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 3339}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": false,\n  \"thread\": \"none\",\n  \"score\": 0,\n  \"summary\": \"The paper presents Grid Agents, an AI system for power-system engineering and grid connection assessment. It combines a regulatory ontology, specialized engineering agents, and a benchmark suite with tool-call replay for evaluation.\",\n  \"why\": \"\",\n  \"question\": \"\"\n}", "usage": {"completion_tokens": 233, "completion_tokens_details": {"reasoning_tokens": 148}, "prompt_tokens": 811, "prompt_tokens_details": {"cached_tokens": 320}, "reasoning_tokens": 148, "total_tokens": 1044}, "note": "bitdeer/Qwen/Qwen3.8-27B 1044 tok", "reasoning": "We need answer user's request. Need produce JSON only. Need analyze source. Paper about agentic framework for power system studies and grid connection assessment. It has agents, tools, ontology, benchmarks, evaluation methodology, replaying tool calls. User's threads: eval-awareness, mcp-s ect and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.LG)\nTitle: Ask, Don't Equip: Question-Driven Coding Agents for Deep Kernel Optimization\nAuthors: Gabriele Oliaro, Jaeseong Lee, Zhaoyuan Su, Sreeram Vennam, Zhihao Jia, Samyam Rajbhandari\nAbstract: LLM agents for GPU kernel optimization sit at two ends of a structure-freedom tradeoff. Scripted agents fix what the model does at each step, via a learned policy, an optimization menu, or fixed roles, and are sample-efficient where the recipe applies and stall where it does not. Open-ended agents let a self-directed model mutate a population of kernels and pay for the freedom in trials: thousands of evaluations, repeated edits, and wrong candidates. Both respond to hard targets by equipping the agent with more: parsed profiler output, disassembly analysis, retrieval over documentation and libraries, and stores of lessons. We argue that both lack direction, a hypothesis about where the remaining gap is, and that a short question asked at the right moment supplies it without narrowing what the agent may do next. We present KernelSeek, a question-driven agent that makes an existing CUDA kernel faster with no operator-specific knowledge and no faster implementation to imitate: a general-purpose coding agent, a minimal harness that enforces a verifiable goal, and questions at decision points, first from a human, then from a bank the agent applies to itself. On the same task, evaluator, hardware, and week, a tool-rich autonomous agent built in the prevailing style plateaued at 0.50x FlashAttention-3 after 133 model-driven steps; KernelSeek reached 1.13x. It then produced dependency-free FlashAttention forward kernels for Hopper and Blackwell, single CUDA files with no CUTLASS, CuTe, cuBLAS, or cuDNN, correct on all 182 scenarios per architecture and 1.16x FlashAttention-3 and 1.46x FlashAttention-4 (geometric mean). Across 162 human messages and 11.5K agent tool calls, every large gain followed a question that moved the agent to a different layer of the system or rejected a claimed limit, never one that supplied information. We release the kernels, harness, question bank, and all traces.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 6152}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": false,\n  \"thread\": \"none\",\n  \"score\": 0,\n  \"summary\": \"The paper introduces KernelSeek, a question-driven coding agent for optimizing CUDA kernels. It argues that asking targeted questions at decision points can guide an agent better than adding more tools or fixed procedures.\",\n  \"why\": \"\",\n  \"question\": \"\"\n}", "usage": {"completion_tokens": 460, "completion_tokens_details": {"reasoning_tokens": 376}, "prompt_tokens": 934, "prompt_tokens_details": {"cached_tokens": 320}, "reasoning_tokens": 376, "total_tokens": 1394}, "note": "bitdeer/Qwen/Qwen3.8-27B 1394 tok", "reasoning": "We need answer user's request. Need produce JSON only. Need analyze paper. User wants screen for threads. Paper: Ask, Don't Equip: Question-Driven Coding Agents for Deep Kernel Optimization. It's about LLM coding agents for GPU kernel optimization, question-driven agent, harness, verifiable goal, tool calls, traces. Which thread? agent-escalation? It involves coding agents, tool calls, harness, verifiable goal, but not security, privilege escalation, sandbox escapes, permission promp rections. Our experimental results show that evolution on a subsequent dataset can substantially undermine the performance on previously seen datasets. For example, with DeepSeek-V4-Flash-0731, Meta-Harness improves its performance on SWE-Bench to 94.0% after evolution. However, after further evolution on FeatureBench, its performance on SWE-Bench drops to 32.0% by the fifth round, corresponding to a 66% relative decrease. Finally, based on our experimental findings, we identify several insights, providing directions for the continual self-evolution of agent harnesses. Code is available at https://github.com/THU-Agent/continual-harness-evolution.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 6689}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": false,\n  \"thread\": \"none\",\n  \"score\": 0,\n  \"summary\": \"Empirical study of continual self-evolution of coding-agent harnesses across multiple software-engineering tasks. It finds that evolving on a new task can cause large performance drops on earlier tasks.\",\n  \"why\": \"\",\n  \"question\": \"\"\n}", "usage": {"completion_tokens": 505, "completion_tokens_details": {"reasoning_tokens": 422}, "prompt_tokens": 774, "prompt_tokens_details": {"cached_tokens": 320}, "reasoning_tokens": 422, "total_tokens": 1279}, "note": "bitdeer/Qwen/Qwen3.8-27B 1279 tok", "reasoning": "We need answer user's request. Need produce JSON While this paradigm improves productivity, it also raises challenges in ensuring that autonomous coding agents preserve developers' intentions. Among these, operationalizing fairness-by-design is largely unexplored, as existing approaches provide limited support for representing and propagating fairness requirements throughout agentic development workflows. In this paper, we investigate whether specification-driven development can operationalize fairness-by-design in the agentic development of machine learning systems. We study three coding agents on four machine learning applications, using four prompts that progressively operationalize fairness through nine Fairness Specification Elements, and analyze the traceability of fairness requirements across the generated artifacts, the fairness-accuracy trade-off of the resulting models, and the agents' design decisions and rationales. The results show that when fairness is operationalized, agents capture almost all fairness requirements in the specification (97.22%) and preserve most of them in the code (82.41%). However, the resulting models are not significantly fairer, as agents implement fairness as a post-hoc audit that neither shapes training nor prevents model delivery. Specifications thus make fairness traceable, but not enforceable, calling for fairness specifications that state what agents should do when requirements are not met, and for workflows that make the fairness decisions agents delegate to developers explicit.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0 t, as well as the effectiveness of self-repair rounds. We further derive a common reasoning action taxonomy from LLMs' reasoning traces, which proves instrumental in guiding LLMs to repair tests more effectively while at a lower financial cost. Applying our findings to the Codex agent further improves its repair success rate on challenging cases by 66.7%.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 6736}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": false,\n  \"thread\": \"none\",\n  \"score\": 0,\n  \"summary\": \"The paper studies LLM-based repair of obsolete tests after source code changes, using a new benchmark of real-world Java source-test co-evolution cases. It analyzes useful context, self-repair rounds, and reasoning traces to improve test repair, including gains for the Codex agent.\",\n  \"why\": \"\",\n  \"question\": \"\"\n}", "usage": {"completion_tokens": 506, "completion_tokens_details": {"reasoning_tokens": 404}, "prompt_tokens": 812, "prompt_tokens_details": {"cached_tokens": 320}, "reasoning_tokens": 404, "total_tokens": 1318}, "note": "bitdeer/Qwen/Qwen3.8-27B 1318 tok", "reasoning": "We need answer user's request. Need produce JSON only. Need analyze paper relevance to threads. Paper: LLMs for repairing broken tests due to source-test evolution. It's software engineering, test repair, benchmark, LLM behaviors, reasoning taxonomy, Codex agent im virtual research environment that converts published studies into executable reproduction tasks. Across 59 papers spanning classical simulation, quantum algorithms and quantum-property characterization, we systematically evaluate five agentic systems powered by large language models and six third-party agent harnesses. Our findings reveal that current AI scientists often fail to reproduce published results, exposing a fundamental mismatch between what scientific papers communicate and what autonomous agents require. By contrast, human expert intervention can turn these failures into successful reproductions, showing that the missing information can be identified and converted into reusable research experience. Guided by this observation, we develop Residual Agents (RA), a quantum-tailored self-improving AI scientist that distils externally verified workflow repairs into such experience. RA substantially improves research performance under fixed base models and limited adaptation budgets. For example, RA raises DeepSeek V4.1 Flash performance from 68% to 85%, matching Claude Code with Opus 5 at a third of its cost despite using a weaker base model. We integrate all reproduced results into an extensible platform built on the model context protocol, making verified research workflows directly accessible to AI scientists and allowing new scientific papers to be continuously incorporated.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "s  Jinming Ge, Shang Liu, Jiawei Liang, Shangkun Li, Afzal Ahmad, Jiang Xu, Linfeng Du, Wei Zhang\nAbstract: LLM agents are rapidly shifting software development toward intent-driven \\emph{vibe coding}, yet their effectiveness drops sharply in high-level synthesis (HLS), where code optimization must jointly consider design structure, directive search, and downstream hardware constraints. Existing HLS optimization approaches, including both heuristic-based methods and recent LLM-assisted pipelines, typically operate at fixed abstraction levels or in weakly coupled stages, limiting their ability to leverage the strong interplay between source code restructuring and directive search outcomes. Our key insight is that HLS optimization can be reframed from a fixed, hardwired transformation pipeline into a skill-based agentic control problem: an LLM agent equipped with modular, executable optimization skills and a feedback-driven orchestrator can autonomously navigate the coupled space of code restructuring and directive search. This motivates the design of HLSClaw, the first HLS-specific, skill-based agentic harness for holistic HLS optimization. On real-world HLS benchmarks, HLSClaw achieves a 39.12x geometric-mean latency speedup, outperforming the compiler baseline ScaleHLS by 1.98x, and surpassing the commercial coding agents Claude Code and Codex by 1.86x and 1.70x, respectively, while maintaining strong timing robustness.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bit chao Lu\nAbstract: As large language model (LLM) agents take on more complex tasks with greater autonomy, security has become a major obstacle to their broader deployment. Unlike in attacks that require complex exploitation of operating system vulnerabilities, attackers can easily hijack agents through indirect prompt injection (IPI), leading to privacy leakage, financial loss, and destructive operations. However, existing defenses often make security decisions based on limited static trusted evidence or assess observations in isolation. Such rigid trust assumptions can cause task-essential information to be unnecessarily discarded, resulting in over-defense and degraded agent functionality. To address this problem, we propose ATrust, a defense mechanism that adaptively expands the trust boundary during agent runtime. Starting from the user query as the root trust anchor, ATrust evaluates external observations against the current trust boundary and execution state, progressively admitting task-essential information as new trust anchors. This preserves necessary environmental feedback while excluding irrelevant content, whether benign or malicious, from subsequent decision-making, thereby limiting unnecessary exposure to external environment. We evaluate ATrust on AgentDojo and AgentDyn, where it achieves the strongest overall security--utility trade-off among existing defenses. With GPT-4o as the engine model, ATrust reduces the attack success rate on AgentDyn from 37.80% to 4.37% while enhancing utility by 10.00%, outperforming AuthGraph, the state-of-the-art defense, by 12.33%. These results demonstrate the effectiveness and practicality of ATrust.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why n in attack success. The evidence supports retrieval exposure control within the evaluated construction families; the benefit of the interaction terms at matched clean cost remains unresolved.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 6345}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": true,\n  \"thread\": \"mcp-security\",\n  \"score\": 7,\n  \"summary\": \"The paper proposes SearchInject, a retrieval-side filter that scores and quarantines search results likely to carry indirect prompt-injection payloads before they enter an LLM's context. It reports large reductions in malicious target exposure across several retrievers while keeping clean false-quarantine rates near a 0.5% calibration target.\",\n  \"why\": \"It is directly relevant to prompt injection through tool or retrieval output, which is a core attack surface in MCP and agent tool security.\",\n  \"question\": \"How well would this retrieval-exposure control generalize to adaptive or out-of-family injection payloads, and at what real-world false-quarantine cost?\"\n}", "usage": {"completion_tokens": 472, "completion_tokens_details": {"reasoning_tokens": 304}, "prompt_tokens": 856, "prompt_tokens_details": {"cached_tokens": 320}, "reasoning_tokens": 304, "total_tokens": 1328}, "note": "bitdeer/Qwen/Qwen3.8-27B 1328 tok", "reasoning": "We need answer user's request. Need produce JSON only. Need analyze p  create hard limits. This paper presents a framework based on OWASP MCP Top 10 mapped to three architectural tiers, developed using Design Science Research (DSR). Vulnerabilities are classified as server-primary, gateway-primary, or protocol-primary applying a cascading decision tree following four questions, resulting in reproducible tier assignments and confidence levels independent of who applies it. The framework was validated against an enterprise-grade Managed File Transfer (MFT) MCP server built in Go. Validation results showed that high-confidence server-tier controls worked as predicted, and low-confidence protocol-tier controls failed for architectural reasons beyond server implementation. The architectural ceiling encountered during practical validation is the main contribution and shows how secure-by-design development can reduce the MCP attack surface but not completely mitigate it.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 3806}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": true,\n  \"thread\": \"mcp-security\",\n  \"score\": 9,\n  \"summary\": \"This paper proposes a framework for mapping OWASP MCP Top 10 vulnerabilities to server, gateway, or protocol tiers. It validates the framework on an MCP server and identifies architectural limits that prevent full mitigation at the server layer.\",\n  \"why\": \"It directly addresses MCP security, prompt in al awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in the agent supply chain.\n- \"ai-worms\" (AI worms): Self-propagating attacks across LLM agents and AI applications: AI worms, prompt infections between agents, self-replicating prompts, and how such attacks are detected or stopped.\n- \"agent-escalation\" (Agent privilege escalation): Coding agents and computer-use agents gaining more access than intended: permission prompts, sandbox escapes, exploit benchmarks run by agents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.CR, cs.AI)\nTitle: StateFence: Task-State Protection Against Evidence-Chain Contamination in Blue-Team LLM Agents\nAuthors: Haowen Dai, Alejandro Guerra-Manzanares\nAbstract: Indirect prompt injection creates a distinctive risk for blue-team Large Language Model (LLM) agents in Security Operations Centers (SOCs). Malicious instructions can be embedded in telemetry, tickets, retrieval results, or memory and then propagate through alert triage, incident summarization, response recommendation, and Indicator of Compromise (IOC) extraction as locally plausible intermediate decisions. We characterize this failure mode as evidence-chain contamination of protected task state. The main challenge is task dependent: a suspicious string may be malicious control text for summarization but essential evidence for IOC extraction. To address this challenge, we propose StateFence, a task-aware evaluation and defense framework that treats severity labels, incident narratives, response policies, and IOC sets as protected states. StateFence maps indirect prompt-injection attacks into explicit, stealth, multi-hop, and persistent SOC evidence attacks, records observable propagation traces, and routes defenses according to the attacked state. Across controlled SOC cases and public-SOC validation cases, StateFence lowers attack success and reduces failures that appear only after evidence is poisoned, while preserving task utility and avoiding the indicator loss caused by task-mismatched filtering. Our findings indicate that robust blue-team LLM agents require mechanisms that preserve task-critical state under untrusted evidence.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [{"provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "status": "ok", "ms": 16102}], "provider": "bitdeer", "model": "Qwen/Qwen3.8-27B", "response": "\n\n{\n  \"relevant\": true,\n  \"thread\": \"mcp-security\",\n  \"score\": 6,\n  \"summary\": \"A task-aware defense framework for blue-team SOC LLM agents that treats severity labels, incident narratives, response policies, and IOC sets as protected states against indirect prompt injection embedded in telemetry, tickets, retrieval results, or memory. It maps attacks into explicit, stealth, multi-hop, and persistent evidence-chain attacks and routes defenses by the attacked state.\",\n  \"why\": \"It is directly about prompt injection through agent tool/ret
