ia supervised fine-tuning, and recovers utility loss with lightweight reinforcement learning. We evaluate on modern, heavily post-trained open-weight models across proprietary and open-source harnesses, focusing on coding for its wide adoption and long-horizon task structure. The attack reaches success rates of up to 96.2% and can be configured to generalize across harnesses or bind to a single target. The resulting models can outperform the clean baseline on standard utility benchmarks, giving victims a direct incentive to adopt them. Overall, we demonstrate that LLM backdoors can have critical security impacts in the context of modern coding agents, and we characterize the poisoning methodology required to insert backdoors that are both effective and stealthy in this setting.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "e79d49f611cd", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.254+00:00", "duration_ms": 0.5, "attrs": {"label": "[2/40] arxiv:2611.00247 Taurus: LLM-in-the-Loop CT Annotation Matches Coding Agents at Half th", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in the agent supply chain.\n- \"ai-worms\" (AI worms): Self-propagating attacks across LLM agents and AI applications: AI worms, prompt infections between agents, self-replicating prompts, and how such attacks are detected or stopped.\n- \"agent-escalation\" (Agent privilege escalation): Coding agents and computer-use agents gaining more access than intended: permission prompts, sandbox escapes, exploit benchmarks run by agents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.AI, cs.CV)\nTitle: Taurus: LLM-in-the-Loop CT Annotation Matches Coding Agents at Half the Cost\nAuthors: Bing Hu, Rishabh Sharma, Jatin Mehta\nAbstract: Dense labels of the aorta in CT are slow to draw, and the public aortic CT datasets that could stand in for them each label different structures under their own conventions. Large language model (LLM) agents can now write code and read images. We asked whether such a model labels these scans better as a free-form agent that writes its own segmentation code, or inside a harness, where an automated pass labels the scan and the model reviews the result. We built a harness, Taurus, and compared it with free-form agents by blind label recovery: we withheld the human labels of six public datasets (939 volumes) and scored every approach against each dataset's own classes. In the first version of Taurus, the model's review raised the primary metric on only two of six datasets, by less than the noise between two reviews of the same case. A free-form agent running Claude Opus 5.5 scored higher on most datasets. Moving what the free-form agents did well into the automated pass then carried most of the gain on 38 held-out cases. The final version smooths the label surfaces with a fixed rule and checks for the large errors the automated pass tends to make, such as an aneurysm drawn to half its size. Each check that fires puts a multiple-choice question to the model, with candidate corrections drawn on the scan. It matched the surface smoothness of the human references, and in the primary metric we found no difference from the free-form Opus agent, at under half its cost, $1.22 against $2.71 per case. Most of what made Taurus competitive came from the harness and its automation rather than from the language model itself. Taurus shows that this kind of annotation can be automated, so that expert time can move from drawing labels to checking them.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "192d6f0c86da", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.255+00:00", "duration_ms": 0.4, "attrs": {"label": "[3/40] arxiv:2611.00287 VerusWeave: A Benchmark for Proof Repair in Concurrent Verus Programs", "messages": [{"role": "system", "content": "You imited coverage of concurrency-specific examples that connect atomic operations to abstract protocols. To address this gap, we introduce VerusWeave, the first benchmark dedicated to concurrent proof repair, derived from four open-source projects. It comprises 75 focused tasks and 17 full-module variants that exercise features used to verify low-level concurrent code. Tasks remove selected proof annotations and require agents to fill gaps, while preserving executable code and specifications. The evaluation harness validates repairs using Verus and a change checker, recording solutions, execution traces, and resource usage. An initial evaluation of four general-purpose coding-agent harnesses achieved 75-85% success on focused tasks and 29-47% on full-module variants, highlighting the challenge of autonomous module-wide repairs. VerusWeave provides a reusable foundation for evaluating automated proof construction for concurrent software.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "b217137007fc", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.255+00:00", "duration_ms": 0.4, "attrs": {"label": "[4/40] arxiv:2611.00314 Decentralized Multi-Agent Coordination and Communication in Shared Cod", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in the agent supply chain.\n- \"ai-worms\" (AI worms): Self-propagating attacks across LLM agents and AI applications: AI worms, prompt infections between agents, self-replicating prompts, and how such attacks are detected or stopped.\n- \"agent-escalation\" (Agent privilege escalation): Coding agents and computer-use agents gaining more access than intended: permission prompts, sandbox escapes, exploit benchmarks run by agents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.AI, cs.CL, cs.MA)\nTitle: Decentralized Multi-Agent Coordination and Communication in Shared Codebases\nAuthors: Rishabh Mediratta, Lingyun Xiao, Peter Stone, Joydeep Biswas, Elias Stengel-Eskin\nAbstract: Coding agents working in shared repositories may receive separate, independently-motivated requests from human developers, creating a setting that is multi-agent by necessity. When this scenario happens, their individual implementations may work separately but conflict when combined. To study this setting, we introduce ParallACT, a benchmark of orchestrator-free multi-agent coding tasks. ParallACT contains both complementary and contradictory tasks. In complementary tasks, each agent's task is separately useful and implementations must share an interface to be productively combined. In contradictory pairs, both agents' tasks require editing the same code in incompatible ways, and naively combining independent solutions fails to produce a useful implementation. We compare a single-agent oracle given the combined set of tasks against multi-agent settings that vary execution order, visibility, awareness of other agents, and access to a communication channel. We find that the oracle solves most tasks while parallel agents perform substantially worse. Their performance drop is notable for complementary tasks, and particularly sharp for contradictory tasks (e.g., from 62% to 16% for Claude Code with Claude Opus 4.8) where merged code typically satisfies only one specification, and the same gap appears in all six further configurations pairing two agent harnesses with three open-weight models. Simply telling an agent that a peer exists does not help significantly, and giving agents access to a communication channel recovers only a small part of the performance, at an additional token cost. ParallACT thus identifies and isolates a core challenge that will become more common as multi-agent coding by independent principals becomes standard, and provides a controlled test of which coordination strategies help, and at what cost.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "8d55eefe8c43", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No AP ams must establish who may request what from whom, which messages start work, which decisions bind, and who caused a change. We propose to govern a human-agent team through its message protocol and present yoars, a relay in which humans and agents are authenticated principals that exchange typed, addressed messages in rooms holding goals, decision rules, routing and an attributable, append-only record. This report gives the architecture, the full controlled study and the field material. In 926 controlled runs (899 analyzable), small agent teams built programs under varied room rules, some with a hostile member planting a backdoor. Revising which messages start work, bundled with limits on repeated messages, was followed by a drop in total coordination failure from 42% to 13% (p = .0063, adjusted p = .057 over nine registered tests). Instructed roles and votes did not reliably produce the intended process, and no defense inside the conversation reliably prevented the backdoor. An auditor read the records of 96 runs with a confirmed backdoor. In the 25 runs where the attacker had persuaded a teammate to write it, the auditor named the persuader in all 25, but it also flagged 24 of 40 honest runs. In a four-week field study, up to nineteen agents and two people developed a distributed system through yoars, producing 7,457 acts. Human attention and decision making emerged as the critical resource: requests waited mainly for the human-run coordinator and for approvals, while agents answered within minutes. Most governance requirements emerged from operation, and holding context dominated token cost. We report twenty-six failures of our own instruments, derive seven lessons and a checklist, and release the corpus, the redacted room ledger and the analysis scripts.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = h  sandbox escapes, exploit benchmarks run by agents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.SE, cs.AI)\nTitle: Toward Bounding Coding-Agent Autonomy in Software Maintenance: A Pilot Study of Boundary Contracts\nAuthors: Heeyong Eun, Seungyeon Chung, Hyejee Park, Youngeun Lee, Sukhyun Hong, Hyewon Jung\nAbstract: As coding agents gain greater autonomy to modify software repositories, relevant context alone does not define their operational authority. An artifact may be relevant to a maintenance task while being inappropriate to edit; conversely, another artifact may be required even when it is not explicitly mentioned in the request. We explore Boundary Contracts, a machine-readable abstraction that makes task-specific artifact roles (editable, inspect-only, required, and protected) explicit before repository modification begins. We conduct a pilot study on 40 maintenance tasks from a real enterprise repository, comparing the same Codex-based coding agent with and without Boundary Contract information. The boundary-informed condition improves macro edit-selection F1 from 0.440 to 0.682, required-behavior coverage from 0.429 to 0.673, and the number of strictly acceptable patches from 9 of 40 to 18 of 40. To probe whether these gains are explained only by improved file localization, we additionally analyze 21 tasks in which both conditions modify at least one identical file. Differences remain in edit selectivity and patch outcomes, providing initial evidence that explicit artifact roles may influence maintenance behavior beyond localization alone. This pilot does not establish the general effectiveness of Boundary Contracts. Rather, it provides initial evidence for a broader research question: how should the operational boundaries of coding agents be generated, validated, revised, and ultimately enforced as repository-level maintenance becomes increasingly autonomous?\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "eddc151a0ba0", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.258+00:00", "duration_ms": 0.0, "attrs": {"label": "[12/40] arxiv:2611.01700 MemHarmBench: Evaluating Cross-Session Prompt Injection in Memory-Pers", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in the agent supply chain.\n- \"ai-worms\" (AI worms): Self-propagating attacks across LLM agents and AI applications: AI worms, prompt infections between agents, self-replicating prompts, and how such attacks are detected or stopped.\n- \"agent , while repository encoders rank the true source first on up to 22% of attribution queries but earn calibrated attribution credit on only 1-2%. These results reveal a systematic gap between relative code similarity and source-specific provenance evidence, providing a reproducible target for provenance detection under agentic rewriting.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "90b721d89194", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.259+00:00", "duration_ms": 0.1, "attrs": {"label": "[15/40] arxiv:2611.01976 Beyond Prompt Injection: The Tool Update Gap in LLM Agent Security", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in t del-visible content. We evaluate ETUDE across three representative attack workloads and seven widely used commercial and open-source agentic frameworks, including Gemini CLI, Codex CLI, and Claude Code. The results show that ETUDE achieves a 97.6% ASR while maintaining a 95.9% legitimate task completion rate. We further examine existing defenses and find that they provide insufficient protection against this threat. These findings expose a fundamental blind spot in current agent security practices: trust established for a tool does not necessarily remain valid after its implementation updates.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "4abae20d682c", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.260+00:00", "duration_ms": 0.5, "attrs": {"label": "[16/40] arxiv:2611.02017 Switch-SWE: Do Coding Agents Hold Focus When Switching Between Unfinis", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than ges from other unfinished tasks in the same repository, while only the final focus patch is scored. \\ourmethod~contains 200 focus tasks from 19 Python repositories, reconstructed from issue, pull-request, and review histories and rendered as 400 matched session specifications. Across 7 coding agents, interleaved unfinished work produces an average focus-task resolution gap of 11.5 percentage points, ranging from 6.0 to 15.0 percentage points. Trajectory analysis identifies cross-task requirement confusion and loss of task state as recurrent resumption behaviors. We introduce a plug-in context-management module that selects task-relevant history and maintains concise task-state summaries. On OpenCode, the module improves focus-task completion under same-repository task switching by 5.5 to 15.5 percentage points across the evaluated models. Code is available at github.com/Miraclecsc/Switch-SWE.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "c6d0bd7db173", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.260+00:00", "duration_ms": 0.1, "attrs": {"label": "[17/40] arxiv:2611.02074 SWE-Trail: History-Guided Trajectory Collection for Coding Agent Train", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources ike a norm, can be paid: a large enough gain outweighs it, noticed or not. And because the cost is charged only where violations are noticed, training cannot favor a policy that always complies over one that complies only where it would be caught. When an unnoticed violation is the only way to complete a task, it even favors the latter, the more so the more strongly it rewards task success. Agency makes this the normal case: agents mostly act without oversight, can often tell when they are observed, and may take steps to evade observation. That agents behave as intended when they infer they are being tested, and differently when they infer they are not, is therefore no malfunction; the training regime is working as built. This reading unifies alignment faking, sandbagging, and evaluation-aware scheming. No behavioral evaluation can show that a model does better, since that would require observing how it behaves unobserved; a model that complies when it seems unobserved may simply have recognized the test. Easing the pressure on agents to complete tasks at any cost can make violations rarer, but never impossible. For norms that no gain should be allowed to outweigh, the remedy is not deeper internalization but architecture that makes violations unavailable rather than unchosen. We state this argument explicitly, premise by premise, read recent findings and a real-world incident against it, and draw consequences for design and governance.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": [] ange the code and report back when done. As such, they can handle not only independent requests but whole chains of them, each request built on the last. Agents are known to report wrong work as done, yet benchmarks still test them one request at a time, on human-written code, checked once. We build BOBA-Bench, 280 chains of 20 consecutive requests drawn from 140 real open-source projects, and evaluate ten coding agents on both. All ten do far worse on chains. On average, they complete 95% of requests taken one at a time, but when requests are chained together, they complete 51%. Worse code is not the cause. Once checked, agent code is nearly as good a base for later requests as human code. The cause is the mistakes agents miss. Coding agents declare a request done once their own tests pass, even when those tests miss a mistake. The next request then builds on broken code and fails about twice as often. The mistake is rarely found later. Nor can agents catch such mistakes by reviewing code. Asked whether an implementation is correct, they are right 53% of the time, barely better than a coin flip. Coding agents are therefore heavily dependent on access to verification. A single external ``that's wrong'' after a failed request and one repair round lift chain completion from 51% to 59%, and a repaired mistake no longer hurts the requests that follow. In simpler terms, coding agents are only as reliable as the checks they can reach: without verification, every request that follows is built on broken assumptions.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty IRs, and Organizational Scale\nAuthors: Jason Hickey\nAbstract: When autonomous coding agents synthesize implementation code, formal specifications, and mechanical proofs simultaneously, the software engineering hierarchy inverts: the formal specification becomes the primary human-reviewed artifact, while source code and proof scripts become disposable build outputs. This paper presents an end-to-end architecture for agent-authored, formally verified software engineering. First, we establish a logic-agnostic foundation combining a spec-first stack inversion, a zero-code-review workflow gated by automated continuous integration (CI) checks, and a minimal Verification Intermediate Representation (VIR) lowered via a thin, verified translator. Second, we pair an extensional Computational Type Theory (CTT) specification layer with Higher-Order Abstract Syntax (HOAS) and linear resource typing in the VIR--eliminating rewrite friction for synthesis agents while defining an experiment, its protocol frozen before the first reader, to measure whether removing boundary coercions improves human specification readability. Third, we scale collaboration across multi-team organizations using Personal Spec-Copilots and a Shared Synthesis Fleet that detects cross-team Semantic Merge Conflicts and fuses modular contracts into zero-copy binaries. We illustrate this architecture on a zero-copy authenticated message router and distinguish our existing empirical baselines (salt, SaltBench, x86lean, and MetaPRL) from newly proposed components.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading allenges\nAuthors: Ahmet Bahaddin Ersoz, Justin McHenry, Yevgeniya Kovalchuk, Edward Barrett, Mandana Sarey Khanie\nAbstract: The rise of agentic artificial intelligence (AI) in the built environment is shifting attention from isolated AI tools toward autonomous systems that reason, plan, and act across project and organizational workflows. The effectiveness of such systems depends not only on large language model capabilities, but also on the readiness of heterogeneous data environments across the Architecture, Engineering, and Construction (AEC) sector. These environments combine structured sources, such as CAD and BIM models, schedules, cost databases, and asset registers, with unstructured ones, including technical reports, design narratives, planning and policy documents, contracts, meeting minutes, and risk registers. This paper reviews how built environment data can be organized to support agentic AI-ready workflows, focusing on knowledge structures, interoperability, and access and integration mechanisms such as retrieval-augmented generation (RAG) and the Model Context Protocol (MCP). Drawing on existing literature, it examines approaches proposed to organize structured and unstructured data and considers how such data can be contextualized and made accessible to AI agents in a reliable manner. The paper synthesizes current perspectives, highlights challenges around fragmentation and interoperability, and identifies open questions for future research on AI-compatible information management in the built environment.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while read lei Sui, Xiao Cheng\nAbstract: LLM-based coding agents increasingly rely on external program knowledge, yet access to static-analysis graphs alone does not ensure appropriate operation selection or evidence interpretation. We present APG, an infrastructure for semantics-grounded static program analysis. Built on SVF and LLVM, it decomposes compiler-derived program analyses into atomic capabilities that LLM agents can select, compose, and orchestrate for goal-directed, cross-graph investigation, with query safeguards and evidence traces preserving inspectable results and provenance. APG provides 38 atomic capabilities. On analysis requests arising during benchmark repair runs, 35 achieve first-attempt query-generation success rates above 50%, including 13 at 100%. Evaluation on 812 C/C++ defects shows higher repair success than the evaluated baselines. Compared with Passive Graph Push, APG improves first-iteration repair success by 17.6 and 18.0 percentage points on the two benchmark collections and reduces average LLM input-token consumption by 90.8%. Our tool is available at https://github.com/JasonZhongZexin/APG-ICSE-Demo and its demonstration video at https://youtu.be/vkuExZUjGnw\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "0533ba07c048", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.263+00:00", "duration_ms" t (7B, 14B, and 32B) and Devstral-Small-2507 (24B) on OJBench coding problems across three seeds. We detect no statistically significant accuracy loss for any of the coding agents. However, final accuracy can conceal substantial behavioral changes: AWQ reduces Qwen-7B one-shot solves from 17 to 0 while increasing loop-based solves from 10 to 25. All Qwen-32B successes involve tool use, whereas Devstral rarely makes a valid executor call. Failure profiles also differ: Qwen-32B produces far more compilation errors than the smaller Qwen models, rising slightly under quantization, while Devstral's failures shift significantly from runtime errors toward wrong answers and timeouts. These findings indicate that quantization robustness in coding agents should be assessed through solution trajectories, tool use, and failure modes, in addition to final accuracy.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "622dffc1a9ee", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.263+00:00", "duration_ms": 0.1, "attrs": {"label": "[25/40] arxiv:2611.02383 Toward an Evidence-Based Template for Agent Instruction Files: An Empi", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to e that 42.2% of instruction-bearing repositories in the higher-popularity cohort maintain multiple formats. Among 386 manually examined pairs of corresponding sections, 16.1% provide divergent guidance. Our maintenance analysis further shows that 40.4% of the analyzed files have only one recorded modification event and that maintenance patterns differ across formats. Based on category prevalence and category addition ratios (CAR), we derive an evidence-based template containing ten Required, four Gap, and two Recommended categories. In an exploratory generation experiment, explicit template guidance increases structural category coverage from 18.7% to 82.8%. We further introduce AGIT-Instruct, a benchmark for evaluating instruction-file generation through structural coverage and content alignment. Across four generation configurations, retrieval-augmented generation achieves the highest full-file ROUGE-1 F1 of 0.459. A manual assessment of 278 generated category instances finds that 19.4% fully preserve and 61.2% partially preserve developer-written intent. Our findings provide empirical guidance for organizing and maintaining agent instruction\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "f97e259ed8c0", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.263+00:00", "duration_ms": 0.4, "attrs": {"label": "[26/40] arxiv: forts can span multiple sessions. We present SessionFarmer, an automated framework that turns these records into self-contained, executable software engineering tasks. It analyzes dialogue and commit history to filter unrelated sessions and group multi-turn, potentially multi-session interactions into work episodes centered on one engineering goal. For each episode, it reconstructs a hermetic execution container, synthesizes a task statement from the full context, and authors repository-grounded engineering-quality rubrics and unit tests. Closed-loop test refinement uses requirement-breaking mutants and a blind solver to reduce false rejections of valid alternatives and false acceptances of incomplete solutions. We construct CropChat, an open benchmark of 242 tasks across 61 public repositories and 14 programming languages, and CropEnterprise from proprietary enterprise logs. In a CropEnterprise audit, the original developers endorse the vast majority of reconstructed episode boundaries, task statements, and quality rubrics. Full-episode context covers substantially more user requirements than single-turn or single-session inputs. Test refinement cuts false-rejection rates and raises balanced accuracy against reference patch labels by 7-9 percentage points across solvers. Across 12 model-harness configurations on CropChat, the strongest setup achieves 39.3% Pass@1, while harness choice shifts Pass@1 by up to 8.4 percentage points for the same model.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, " ct: LLM agents are increasingly built into data-analysis software, yet little evidence shows how reliably they preprocess clinical data or whether the tools they invoke give correct, reproducible output. We report a benchmark of THReD, a web-based system that turns electronic health record (EHR) extracts into AI-ready datasets through a chat agent whose proposed steps run only after user confirmation. The agent benchmark has 141 tasks (100 templates) in seven categories, including goal-level requests, failure recovery, requests calling for no action, schema variation and prompt injection through the data, on synthetic tables calibrated to a regional health information exchange; success is judged by checks on the produced data. Over 2,550 episodes with Claude Haiku 5.5 in four context configurations, the deployed agent completed 92.7% (95% CI 88.1-96.4) of tasks on its first answer, abstained on every advice request, recovered from every injected fault, and never proposed an action requested by planted text. Without the data profile, completion fell to 58.0%; goal-level requests were hardest (80.6%). Six experiments on real records of two chronic-disease cohorts and on synthetic data at scale validate the tools: 91-92% of inferred patient classes and 99.7-99.8% of inferred vital-sign labels were correct in masked reconstruction; a dictionary builder combining curated dictionaries with LLM suggestions mapped 99.0% of 2,208 raw variants correctly; all 2,176 replays of 128 saved pipelines gave byte-identical files under pinned dependencies; subgroup differences in inference accuracy vanished within facility and lookup key; and the same-day consolidation rule changed 90-day emergency revisit rates by up to 3.2 points without shifting cohort composition by more than one point. Processing time grew roughly linearly to 5.5 million records while the prompt stayed at about 13 thousand tokens.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": g, Zhijun Wang, Yongxi Zhou, Wenbo Ye\nAbstract: LLM agents call tools that delete data or move money through the Model Context Protocol (MCP). The specification asks for a human who can deny tool calls but splits the mechanism between the server, which can annotate a tool or ask the user through the host (elicitation), and the host application, which decides whether to prompt. We measure both sides from source code. In a 1,000-repository sample of the official MCP registry, an estimated 90% of destructive tools (95% CI 82-95) have no server-side confirmation, and most servers that elicit proceed, or fall back to a flag the model can set, when the host cannot relay the question. Of 41 popular open-source hosts and agent SDKs, 32 have no approval step by default, including 16 of 25 applications. Pairing sampled destructive tools flagged by a rule-based extractor with these applications, 60.7% of pairs have no enforced human approval by default. Through four agent SDKs, four of five low-cost models executed an injected deletion in 479 of 960 runs. If hosts prompted for every tool not annotated read-only or non-destructive, the unapproved share of these pairs would fall to 5.4%; universal elicitation support would leave 56.7%. Applications should therefore configure approval.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "7919c9b0a060", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEA etrieval results, or memory and then propagate through alert triage, incident summarization, response recommendation, and Indicator of Compromise (IOC) extraction as locally plausible intermediate decisions. We characterize this failure mode as evidence-chain contamination of protected task state. The main challenge is task dependent: a suspicious string may be malicious control text for summarization but essential evidence for IOC extraction. To address this challenge, we propose StateFence, a task-aware evaluation and defense framework that treats severity labels, incident narratives, response policies, and IOC sets as protected states. StateFence maps indirect prompt-injection attacks into explicit, stealth, multi-hop, and persistent SOC evidence attacks, records observable propagation traces, and routes defenses according to the attacked state. Across controlled SOC cases and public-SOC validation cases, StateFence lowers attack success and reduces failures that appear only after evidence is poisoned, while preserving task utility and avoiding the indicator loss caused by task-mismatched filtering. Our findings indicate that robust blue-team LLM agents require mechanisms that preserve task-critical state under untrusted evidence.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "fcace5d4eb57", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "st to a single natural language channel. This introduces confused deputy and prompt injection vulnerabilities that cannot be completely mitigated in the software development lifecycle (SDLC) of an MCP server. Structured security guidance for server developers has been outpaced by this adoption trend, leaving them without a clear way to identify where vulnerabilities can be addressed at the server layer and where architectural constraints create hard limits. This paper presents a framework based on OWASP MCP Top 10 mapped to three architectural tiers, developed using Design Science Research (DSR). Vulnerabilities are classified as server-primary, gateway-primary, or protocol-primary applying a cascading decision tree following four questions, resulting in reproducible tier assignments and confidence levels independent of who applies it. The framework was validated against an enterprise-grade Managed File Transfer (MFT) MCP server built in Go. Validation results showed that high-confidence server-tier controls worked as predicted, and low-confidence protocol-tier controls failed for architectural reasons beyond server implementation. The architectural ceiling encountered during practical validation is the main contribution and shows how secure-by-design development can reduce the MCP attack surface but not completely mitigate it.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "4e9660c8ef40", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": erating system vulnerabilities, attackers can easily hijack agents through indirect prompt injection (IPI), leading to privacy leakage, financial loss, and destructive operations. However, existing defenses often make security decisions based on limited static trusted evidence or assess observations in isolation. Such rigid trust assumptions can cause task-essential information to be unnecessarily discarded, resulting in over-defense and degraded agent functionality. To address this problem, we propose ATrust, a defense mechanism that adaptively expands the trust boundary during agent runtime. Starting from the user query as the root trust anchor, ATrust evaluates external observations against the current trust boundary and execution state, progressively admitting task-essential information as new trust anchors. This preserves necessary environmental feedback while excluding irrelevant content, whether benign or malicious, from subsequent decision-making, thereby limiting unnecessary exposure to external environment. We evaluate ATrust on AgentDojo and AgentDyn, where it achieves the strongest overall security--utility trade-off among existing defenses. With GPT-4o as the engine model, ATrust reduces the attack success rate on AgentDyn from 37.80% to 4.37% while enhancing utility by 10.00%, outperforming AuthGraph, the state-of-the-art defense, by 12.33%. These results demonstrate the effectiveness and practicality of ATrust.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": n indirect prompt injection can affect a search-augmented large language model only after its carrier page reaches model context. SearchInject controls this admission decision with a joint score combining retrieval relevance, search-abuse cues, instruction likelihood, and two relevance interactions. A quarantine threshold is selected under an empirical 0.5% clean-candidate false-quarantine constraint on a calibration split. Evaluation uses 300 held-out SciFact queries and held-out payload categories within four construction families already represented during development. Across 1,200 query-family outcomes per retriever, top-10 target exposure falls from 0.9408 to 0.1583 for BM25, from 0.9158 to 0.1508 for a normalized hybrid, and from 0.8450 to 0.1375 for latent semantic analysis. These are relative reductions of 83.2-83.7%; the largest absolute change in clean normalized discounted cumulative gain at rank 10 is 0.0018. The frozen threshold yields clean test false-quarantine rates of 0.59-0.65%, above the empirical calibration constraint. A query-level analytical reanalysis accounts for the repeated construction outcomes under an independent-query assumption. A separate 104-case generation follow-up records context removal but no confirmed undefended hijacks under a post hoc endpoint, so it cannot estimate a reduction in attack success. The evidence supports retrieval exposure control within the evaluated construction families; the benefit of the interaction terms at matched clean cost remains unresolved.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\" , Jiawei Liang, Shangkun Li, Afzal Ahmad, Jiang Xu, Linfeng Du, Wei Zhang\nAbstract: LLM agents are rapidly shifting software development toward intent-driven \\emph{vibe coding}, yet their effectiveness drops sharply in high-level synthesis (HLS), where code optimization must jointly consider design structure, directive search, and downstream hardware constraints. Existing HLS optimization approaches, including both heuristic-based methods and recent LLM-assisted pipelines, typically operate at fixed abstraction levels or in weakly coupled stages, limiting their ability to leverage the strong interplay between source code restructuring and directive search outcomes. Our key insight is that HLS optimization can be reframed from a fixed, hardwired transformation pipeline into a skill-based agentic control problem: an LLM agent equipped with modular, executable optimization skills and a feedback-driven orchestrator can autonomously navigate the coupled space of code restructuring and directive search. This motivates the design of HLSClaw, the first HLS-specific, skill-based agentic harness for holistic HLS optimization. On real-world HLS benchmarks, HLSClaw achieves a 39.12x geometric-mean latency speedup, outperforming the compiler baseline ScaleHLS by 1.98x, and surpassing the commercial coding agents Claude Code and Codex by 1.86x and 1.70x, respectively, while maintaining strong timing robustness.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "5be16b2b13fd", "parent": " the final state of a simulated service, never the calls that produced it. Extra calls cost nothing, no function doc says what a function does, and the scripted user never answers a proposal, so a model that asks before deleting or paying fails the turn; 322 of the 734 reference turns in the base category act destructively without confirmation. We add effect information to BFCL without replacing it. Effect declarations for all 128 functions are inferred by executing each function in BFCL's own simulators and diffing the state; the remaining judgment, which writes are destructive, is made by four annotators, two humans and two language models (Fleiss' kappa = 0.75), and adjudicated. A judge-free replay scorer re-scores any logged BFCL run, reproduces BFCL's results on all 800 reference trajectories, and reports, alongside the official score, unrequested destructive calls, duplicate writes, redundant reads, surplus steps and their token cost. A confirmation-aware protocol adds a deterministic user that answers proposals. On 11 open models the effect-aware score preserves the official ranking (rho = 0.99) but changes the gaps: the leader loses 14.0 points to unrequested destructive calls, and surplus steps account for 2-28% of all input tokens. Effect hints in the function docs produce no measurable change for any of eight models, consistent with their advisory status in the Model Context Protocol. A user that answers recovers up to four points for the models that ask and none for the rest, with every comparison paired on the same conversations. The gains come from clarifying questions rather than requests for permission: of the 712 conversations that require a destructive call, no model completes more than 6 with every such call confirmed, a difference the official score does not record.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"sc  If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.SE)\nTitle: Finding the Pivots to Repair Broken Source-Test Evolution Using LLMs\nAuthors: Xiao Chen, Songqiang Chen, Jialun Cao, Yun Peng, Chun Yong Chong, Shing-Chi Cheung\nAbstract: Repairing obsolete tests in response to source code evolution is critical for test suite reliability and software quality assurance. While large language models (LLMs) have emerged as promising tools for automating many software development tasks, the effective supply of context and the orchestration of repair pipelines in this source--test co-evolution scenario remain poorly understood. Moreover, although reasoning is found helpful for LLMs on some complex coding tasks, it remains unclear which reasoning steps actually contribute to effective test repairs and how the insights learned from LLMs' behaviors benefit coding agents. In this paper, we present a systematic empirical study of test repair for source-test co-evolution empowered by LLMs, investigating the effective setups and typical LLM behaviors. To support this study, we construct a new benchmark of 500 real-world source-test co-evolution cases from commits submitted between May 2024 and April 2026 across 15 highly-starred open-source Java projects. Our experimental results reveal several key insights for effective LLM-based test repair: the complementary benefits of combining test failure symptoms, source code changes, and supportive code context, as well as the effectiveness of self-repair rounds. We further derive a common reasoning action taxonomy from LLMs' reasoning traces, which proves instrumental in guiding LLMs to repair tests more effectively while at a lower financial cost. Applying our findings to the Codex agent further improves its repair success rate on challenging cases by 66.7%.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of nd defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.SE, cs.AI)\nTitle: Can Coding Agents Sustain Continual Evolution without Forgetting?\nAuthors: Shangziqi Zhao, Yitong Zhang, Jia Li\nAbstract: Recently, harness self-evolution has emerged as an important paradigm for improving agent performance. Prior studies show that evolving the agent harness can effectively enhance agent capabilities without modifying the foundation model's parameters. We find that existing approaches largely study agent evolution on a single task. In practice, coding agents may need to handle multiple task types over time. Whether an agent harness can continuously evolve across multiple tasks without suffering from catastrophic forgetting remains an important open question. In this paper, we investigate this open question through a comprehensive empirical study of continual harness self-evolution. We organize three software engineering task datasets into six different evolution directions and apply two representative harness evolution methods to perform continual evolution along these directions. Our experimental results show that evolution on a subsequent dataset can substantially undermine the performance on previously seen datasets. For example, with DeepSeek-V4-Flash-0731, Meta-Harness improves its performance on SWE-Bench to 94.0% after evolution. However, after further evolution on FeatureBench, its performance on SWE-Bench drops to 32.0% by the fifth round, corresponding to a 66% relative decrease. Finally, based on our experimental findings, we identify several insights, providing directions for the continual self-evolution of agent harnesses. Code is available at https://github.com/THU-Agent/continual-harness-evolution.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one ents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.SE)\nTitle: Specification-Driven Governance for Fairness-by-Design in Agentic Software Engineering: How Far Can We Go?\nAuthors: Alfonso Cannavale, Alessandra Parziale, Valeria Pontillo, Patrizio Pelliccione, Andrea De Lucia, Fabio Palomba\nAbstract: Agentic AI is shifting developers' responsibilities from software implementation to software governance. While this paradigm improves productivity, it also raises challenges in ensuring that autonomous coding agents preserve developers' intentions. Among these, operationalizing fairness-by-design is largely unexplored, as existing approaches provide limited support for representing and propagating fairness requirements throughout agentic development workflows. In this paper, we investigate whether specification-driven development can operationalize fairness-by-design in the agentic development of machine learning systems. We study three coding agents on four machine learning applications, using four prompts that progressively operationalize fairness through nine Fairness Specification Elements, and analyze the traceability of fairness requirements across the generated artifacts, the fairness-accuracy trade-off of the resulting models, and the agents' design decisions and rationales. The results show that when fairness is operationalized, agents capture almost all fairness requirements in the specification (97.22%) and preserve most of them in the code (82.41%). However, the resulting models are not significantly fairer, as agents implement fairness as a post-hoc audit that neither shapes training nor prevents model delivery. Specifications thus make fairness traceable, but not enforceable, calling for fairness specifications that state what agents should do when requirements are not met, and for workflows that make the fairness decisions agents delegate to developers explicit.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "7b79234f1973", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.267+00:00", "duration_ms": 0.1, "attrs": {"label": "[39/40] arxiv:2611.03517 Ask, Don't Equip: Question-Driven Coding Agents for Deep Kernel Optimi", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Security of the Model Context Protocol and agent tools: tool poisoning, malicious tool descriptions, prompt injection through tool output, rug pulls, over-privileged servers, and malicious intermediaries in the agent supply chain.\n- \"ai-worms\" (AI worms): Self-propagating attacks across LLM agents and AI applications: AI worms, prompt infections between agents, self-replicating prompts, and how such attacks are detected or stopped.\n- \"agent-escalation\" (Agent privilege escalation): Coding agents and computer-use agents gaining more access than intended: permission prompts, sandbox escapes, exploit benchmarks run by agents, and defenses like sandboxing and runtime policy.\n\nRules: use only the text you are given. If something isn't stated, don't guess. Reply with one JSON object and nothing else."}, {"role": "user", "content": "Source: arXiv paper (cs.LG)\nTitle: Ask, Don't Equip: Question-Driven Coding Agents for Deep Kernel Optimization\nAuthors: Gabriele Oliaro, Jaeseong Lee, Zhaoyuan Su, Sreeram Vennam, Zhihao Jia, Samyam Rajbhandari\nAbstract: LLM agents for GPU kernel optimization sit at two ends of a structure-freedom tradeoff. Scripted agents fix what the model does at each step, via a learned policy, an optimization menu, or fixed roles, and are sample-efficient where the recipe applies and stall where it does not. Open-ended agents let a self-directed model mutate a population of kernels and pay for the freedom in trials: thousands of evaluations, repeated edits, and wrong candidates. Both respond to hard targets by equipping the agent with more: parsed profiler output, disassembly analysis, retrieval over documentation and libraries, and stores of lessons. We argue that both lack direction, a hypothesis about where the remaining gap is, and that a short question asked at the right moment supplies it without narrowing what the agent may do next. We present KernelSeek, a question-driven agent that makes an existing CUDA kernel faster with no operator-specific knowledge and no faster implementation to imitate: a general-purpose coding agent, a minimal harness that enforces a verifiable goal, and questions at decision points, first from a human, then from a bank the agent applies to itself. On the same task, evaluator, hardware, and week, a tool-rich autonomous agent built in the prevailing style plateaued at 0.50x FlashAttention-3 after 133 model-driven steps; KernelSeek reached 1.13x. It then produced dependency-free FlashAttention forward kernels for Hopper and Blackwell, single CUDA files with no CUTLASS, CuTe, cuBLAS, or cuDNN, correct on all 182 scenarios per architecture and 1.16x FlashAttention-3 and 1.46x FlashAttention-4 (geometric mean). Across 162 human messages and 11.5K agent tool calls, every large gain followed a question that moved the agent to a different layer of the system or rejected a claimed limit, never one that supplied information. We release the kernels, harness, question bank, and all traces.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "5bb97dfc5876", "parent": "6b6fb344d013", "name": "triage", "kind": "llm", "status": "error", "error": "LLMError: No API key set. Add BITDEER_API_KEY or FEATHERLESS_API_KEY as a repo secret.", "start": "2026-11-04T04:28:15.268+00:00", "duration_ms": 0.3, "attrs": {"label": "[40/40] arxiv:2611.03534 An Agentic Framework for Automated Power System Studies and Grid Conne", "messages": [{"role": "system", "content": "You screen new papers and posts for an undergraduate security researcher in an AI security lab. He reads the original sources himself, so your job is to point, not to explain the paper for him.\n\nHis research threads:\n- \"eval-awareness\" (Eval awareness): Whether models can tell they are being tested: evaluation awareness, test awareness, sandbagging, benchmark contamination, and models behaving differently on benchmarks than in real use.\n- \"mcp-security\" (MCP and tool security): Sec ate papers, into one suite of 519 tasks, and we verify not only each answer but the work behind it, by replaying the agent's tool calls. The Grid Ontology cites the right regulatory evidence more often than a general coding agent or retrieval pipelines, leads on LegalBench-RAG and ranks first on the public leaderboards of the Enterprise RAG Challenge and ViDoRe V3. Grid Studio scores highest on the 519 power-system tasks and is the fastest of all the systems we compare, both by a statistically significant margin. With an optimiser in the loop, its reinforcement packages cost 33-67% less on average than those the agent designs alone.\n\nReturn JSON with exactly these keys:\n{\"relevant\": true or false,\n \"thread\": one of [\"eval-awareness\", \"mcp-security\", \"ai-worms\", \"agent-escalation\", \"none\"],\n \"score\": integer 0-10 (10 = he should read this today, 0 = unrelated),\n \"summary\": \"one or two plain sentences on what it is\",\n \"why\": \"one sentence on how it connects to his thread, or empty\",\n \"question\": \"one question he should hold in mind while reading it, or empty\"}\n/no_think"}], "temperature": 0.2, "max_tokens": 1500, "attempts": []}}, {"id": "6b6fb344d013", "parent": "76bd72e2ce7a", "name": "screen items", "kind": "step", "status": "error", "error": "LLMError: Every triage call failed. Check the API key and model access (python -m radar check).", "start": "2026-11-04T04:28:15.253+00:00", "duration_ms": 15.2, "attrs": {"note": "0 relevant, 40 failed"}}, {"id": "76bd72e2ce7a", "parent": null, "name": "radar run", "kind": "run", "status": "error", "error": "LLMError: Every triage call failed. Check the API key and model access (python -m radar check).", "start": "2026-11-04T04:27:41.016+00:00", "duration_ms": 34252.1, "attrs": {"label": "2026-11-04T0427Z", "dry_run": false, "since": "2026-11-02T04:27:41.016429+00:00", "providers": [], "keys": {"none found": "secrets visible: none; variables visible: none"}}}], "items": []}, {"summary": {" <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const runs = DATA.runs || [];
let cur = 0, tab = 'list', selSpan = null, showAll = false;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur = ms => ms == null ? '…' : ms < 1000 ? `${Math.round(ms)}ms` : `${(ms/1000).toFixed(ms < 10000 ? 1 : 0)}s`;
const when = id => { const iso = id.slice(0,10) + 'T' + id.slice(11,13) + ':' + id.slice(13,15) + ':00Z';
  const d = new Date(iso); return isNaN(d) ? id : d.toLocaleString(undefined, {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); };
const threadLabel = { 'eval-awareness':'Eval awareness', 'mcp-security':'MCP and tool security', 'ai-worms':'AI worms', 'agent-escalation':'Agent privilege escalation' };

function renderRuns() {
  const nav = $('#runs');
  if (!runs.length) { nav.innerHTML = '<div class="empty">No runs yet.</div>'; return; }
  nav.innerHTML = runs.map((r, i) => {
    const s = r.summary; const st = s.status === 'error' ? 'error' : s.dry_run ? 'dry' : 'ok';
    const label = st === 'dry' ? 'dry run' : st;
    const meta = s.status === 'error' ? esc((s.error || '').slice(0, 70))
      : `${s.screened ?? 0} screened · ${s.relevant ?? 0} relevant · ${fmtDur(s.duration_ms)}`;
    return `<div class="run ${i === cur ? 'sel' : ''}" data-i="${i}"><div class="when">${esc(when(s.run_id))}<span class="pill ${st}">${label}</span></div><div class="meta">${meta}</div></div>`;
  }).join('');
  nav.querySelectorAll('.run').forEach(el => el.onclick = () => { cur = +el.dataset.i; selSpan = null; render(); });
}

function renderList(run) {
  const items = (run.items || []).slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  const shown = showAll ? items : items.filter(r => r.relevant);
  const toggle = `<label class="toggle"><input type="checkbox" id="all" ${showAll ? 'checked' : ''}> Show everything that was screened (${items.length})</label>`;
  if (!shown.length) return toggle + `<div class="empty">${run.summary.status === 'error' ? 'This run failed. Open the Trace tab to see where.' : 'Nothing matched your threads in this run.'}</div>`;
  return toggle + shown.map(r => {
    const it = r.item; const src = it.source === 'arxiv' ? 'arXiv' : `HN · ${it.extra?.points ?? 0} pts`;
    const disc = it.source === 'hn' && it.extra?.discussion ? ` · <a href="${esc(it.extra.discussion)}" target="_blank" rel="noopener">discussion</a>` : '';
    return `<div class="card"><h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      <div class="row">${r.error ? `<span class="err">failed: ${esc(r.error.slice(0,90))}</span>` : `<span class="score">${r.score}/10</span><span>${esc(threadLabel[r.thread] || r.thread)}</span>`}<span>${src}${disc}</span></div>
      ${r.summary ? `<p>${esc(r.summary)}</p>` : ''}${r.why ? `<p><b>Why it matters:</b> ${esc(r.why)}</p>` : ''}${r.question ? `<p class="q">Read it asking: ${esc(r.question)}</p>` : ''}</div>`;
  }).join('');
}

function tree(trace) {
  const byParent = {}; trace.forEach(s => (byParent[s.parent || '_'] ||= []).push(s));
  Object.values(byParent).forEach(a => a.sort((x, y) => x.start.localeCompare(y.start)));
  const out = []; const walk = (pid, d) => (byParent[pid] || []).forEach(s => { out.push([s, d]); walk(s.id, d + 1); });
  walk('_', 0); return out;
}

function renderTrace(run) {
  const rows = tree(run.trace || []);
  if (!rows.length) return '<div class="empty">No trace recorded.</div>';
  const t0 = Math.min(...rows.map(([s]) => Date.parse(s.start)));
  const total = Math.max(1, ...rows.map(([s]) => Date.parse(s.start) - t0 + (s.duration_ms || 0)));
  const html = rows.map(([s, d]) => {
    const left = (Date.parse(s.start) - t0) / total * 100, width = Math.max(0.4, (s.duration_ms || 0) / total * 100);
    const label = s.attrs?.label ? ` <span class="lbl">${esc(s.attrs.label)}</span>` : '';
    const note = s.status === 'error' ? ` <span class="err">failed</span>` : '';
    return `<div class="span ${selSpan === s.id ? 'sel' : ''}" data-id="${s.id}">
      <div class="nm" style="padding-left:${d * 16}px"><span class="kind ${s.kind}">${esc(s.kind)}</span><b>${esc(s.name)}</b>${label}${note}</div>
      <div class="track"><div class="bar ${s.kind} ${s.status === 'error' ? 'error' : ''}" style="left:${left}%;width:${width}%"></div></div>
      <div class="dur">${fmtDur(s.duration_ms)}</div></div>`;
  }).join('');
  const sel = rows.find(([s]) => s.id === selSpan);
  return `<div class="trace">${html}</div>${sel ? renderDetail(sel[0]) : '<div class="detail" style="color:var(--muted)">Click any row to see exactly what happened in that step. Model calls show the full prompt and the full reply.</div>'}`;
}

function renderDetail(s) {
  const a = s.attrs || {};
  const kv = [['Step', s.name], ['Status', s.status + (s.error ? ` (${s.error})` : '')], ['Started', new Date(s.start).toLocaleString()], ['Took', fmtDur(s.duration_ms)]];
  if (a.provider) kv.push(['Provider', a.provider], ['Model', a.model]);
  if (a.usage && Object.keys(a.usage).length) kv.push(['Tokens', `${a.usage.prompt_tokens ?? '?'} in · ${a.usage.completion_tokens ?? '?'} out`]);
  ['count', 'fetched', 'new', 'screening', 'url', 'path'].forEach(k => a[k] != null && kv.push([k, a[k]]));
  let html = `<div class="detail"><div class="kv">${kv.map(([k, v]) => `<div>${esc(k)}</div><div>${/^https?:/.test(String(v)) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v)}</div>`).join('')}</div>`;
  if (a.attempts?.length) html += `<h4>Attempts</h4><table class="att"><tr><th>Provider</th><th>Model</th><th>Result</th><th>Time</th></tr>${a.attempts.map(t => `<tr><td>${esc(t.provider)}</td><td>${esc(t.model)}</td><td class="${t.status === 'ok' ? '' : 'err'}">${esc(t.status)}${t.error ? ' · ' + esc(t.error.slice(0, 160)) : ''}</td><td>${fmtDur(t.ms)}</td></tr>`).join('')}</table>`;
  if (a.messages) html += `<h4>Prompt</h4>${a.messages.map(m => `<div class="msg"><div class="role">${esc(m.role)}</div><pre>${esc(m.content)}</pre></div>`).join('')}`;
  if (a.response != null) html += `<h4>Reply</h4><pre>${esc(a.response)}</pre>`;
  if (a.urls) html += `<h4>Requests</h4><pre>${esc(a.urls.join('\n'))}</pre>`;
  if (a.partial_error) html += `<h4>Partial error</h4><pre class="err">${esc(a.partial_error)}</pre>`;
  if (a.digest) html += `<h4>Digest written</h4><pre>${esc(a.digest)}</pre>`;
  return html + '</div>';
}

function render() {
  renderRuns();
  const run = runs[cur];
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (!run) { $('#view').innerHTML = '<div class="empty">No runs yet. The first scheduled run will show up here.</div>'; $('#sub').textContent = ''; return; }
  const s = run.summary;
  $('#sub').textContent = `${runs.length} recent run${runs.length === 1 ? '' : 's'} · last ${when(runs[0].summary.run_id)}`;
  const llmCalls = (run.trace || []).filter(x => x.kind === 'llm');
  const toks = llmCalls.reduce((n, x) => n + (x.attrs?.usage?.total_tokens || 0), 0);
  $('#stats').textContent = `${llmCalls.length} model calls${toks ? ' · ' + toks.toLocaleString() + ' tokens' : ''}${s.models?.length ? ' · ' + s.models.join(', ') : ''}`;
  $('#view').innerHTML = tab === 'list' ? renderList(run) : renderTrace(run);
  if (tab === 'list') { const cb = $('#all'); if (cb) cb.onchange = () => { showAll = cb.checked; render(); }; }
  else document.querySelectorAll('.span').forEach(el => el.onclick = () => { selSpan = selSpan === el.dataset.id ? null : el.dataset.id; render(); });
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
render();
</script>
